services:

  backend:
    build: .

    container_name: gitops-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

  postgres:
    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_DB: gitops_db
      POSTGRES_USER: gitops_user
      POSTGRES_PASSWORD: gitops_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: